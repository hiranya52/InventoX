<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InventoX</title>
    <link rel="stylesheet" href="./assets/styles/style.css" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
</head>
<body>

    <nav class="navy-gradient px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-2xl">
        <div class="flex items-center space-x-3">
            <div class="bg-purple-500 p-2 rounded-xl ml-8">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <span class="text-white font-bold text-2xl tracking-tight">Invento<span class="text-purple-400">X</span></span>
        </div>

        <div class="flex items-center gap-6">
            <!-- <div class="hidden md:flex space-x-6 text-gray-300 font-medium">
                <a href="#" class="hover:text-purple-400 transition">Analytics</a>
                <a href="#" class="hover:text-purple-400 transition">Stock</a>
                <a href="#" class="hover:text-purple-400 transition">Suppliers</a>
            </div> -->
            <button data-modal-target="product-modal" data-modal-toggle="product-modal" class="btn-interactive text-white px-6 py-2.5 rounded-full font-semibold shadow-lg purple-glow flex items-center gap-2 mr-8">
                <span>+</span> Add Product
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <div class="mb-10 flex flex-col md:flex-row md:items-center justify-between gap-4" data-aos="fade-down">
            <div>
                <h1 class="text-4xl font-extrabold text-navy-900 tracking-tight">Our Collection</h1>
                <p class="text-gray-500 mt-1">Manage your inventory and stock levels in real-time.</p>
            </div>
            
            <div class="flex flex-wrap gap-2">
                <button class="px-5 py-2 rounded-full border-2 border-purple-600 bg-purple-600 text-white font-medium">All Items</button>
                <button class="px-5 py-2 rounded-full border-2 border-gray-200 text-gray-600 hover:border-purple-300 hover:text-purple-600 transition">Beauty</button>
                <button class="px-5 py-2 rounded-full border-2 border-gray-200 text-gray-600 hover:border-purple-300 hover:text-purple-600 transition">Fragrance</button>
                <button class="px-5 py-2 rounded-full border-2 border-gray-200 text-gray-600 hover:border-purple-300 hover:text-purple-600 transition">Electronics</button>
            </div>
        </div>

        <!-- Product Divs -->
            <div id="products-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                <div id="loading" class="loading">Loading...</div>
            </div>

        </div>

        
    </main>
    
    <script src="./assets/js/app.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <script>
        AOS.init({duration: 1000,once: true,});
    </script>
</body>
</html>
